# =============================================================================
# Pia-Pia Bot 🦜 — Docker Compose
# =============================================================================
# Lancement : docker compose up -d
# Logs      : docker compose logs -f
# Arrêt     : docker compose down
# Rebuild   : docker compose up -d --build
# =============================================================================

services:
  pia-pia:
    build: .
    container_name: pia-pia
    restart: unless-stopped
    env_file: .env

    volumes:
      # Sessions audio (WAV) — persisted on the host
      - ./.logs:/app/.logs

      # Player maps par guilde — persisted on the host
      - ./config/player_maps:/app/config/player_maps